geometry:
  halfling-home/1:
    edges:
      # The round green front door (H1, p. 14): "locked, but is old and
      # rotten, and can be easily knocked in". In play that is a stuck door:
      # no key exists anywhere, and forcing is the module's own remedy.
      "12,9:west": { kind: door, door: { stuck: true } }
    reason: >-
      The front door at H1 (p. 14) is locked but rotten and easily knocked
      in. In play that is a stuck door the party can force, not a lock that
      only a thief can pick, which is how the draft placed it.
