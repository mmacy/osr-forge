cases:
  - "6: page 38's lairs' ground runs into the shared ravine across elevation lines (ruled in pull request 102: an answer key's outline border may follow a contour or elevation line)"
  - "8: an unprinted entrance key on a lair whose outline ends at a slope (ruled in pull request 105: its opening is chosen among the outer openings into unkeyed floor)"
  - "9: lairs that are separate dungeons in the survey but whose floors meet (ruled in pull request 109: the outline round separates them where the outlines made them meet, and a cut between dungeons whose floors meet in the drawing lays passages that name the other dungeon)"
  - "10: a key printed outside its lair's cave mouth (ruled in pull request 114: it stays out of the outline and moves inside the mouth)"
  - "11: a lair whose cave mouth isn't among its outer openings (ruled in pull request 116: a letter that equals a whole word of a dungeon's printed name, printed within two cells of a cave mouth, marks the mouth as the dungeon's and can print its entrance key)"
  - "12: an unprinted entrance key with no outer opening into unkeyed floor (ruled in pull request 119: it is placed as other unprinted keys are, in the unlabelled walled room beside its connected area or a synthesized area)"
  - "13 and 14: passages drawn narrower than half a cell, or along a cell line or across a corner (ruled in pull request 126: a passage drawn as floor at least a sixth of a cell wide that joins two floor regions the half-floor rule leaves apart keeps a chain of cells along its course, taking the cell with the most floor where it covers more than one cell across its course or turns a corner, and a floor cell on its course as it is; a door across a corner with floor drawn through it stands on the step cell with more floor)"
  - "15: a 5-foot opening on a 10-foot edge (ruled in pull request 124: it keeps the edge open when its squares are floor in one open space and both cells are floor)"
  - "16: a panel's cells outside its drawn grid (decided by the registration contract: the manor maps are keyed on their registered grids, without the title and legend above the frame)"
  - "17: a courtyard reached only along the top of a wall (ruled on branch stair-tops: steps up onto a wall lead onto the wall's top, which no level holds, so they join nothing, and ground that only a wall's top reaches stays unreached)"
  - "18: stairs whose top meets a level across a drawn line (ruled on branch stair-tops: a stairway's top end opens onto the floor it meets, whatever line is drawn across it, unless a door is drawn there)"
