instrument: >-
  Two independent readings per map: Claude Sonnet 5.5 (claude-sonnet-5-5) at high effort reading 12 by 12
  cell windows with grid ticks through tools/answer_keys/reader.py, which isn't the tracing stage's code,
  and the ink classifier tools/answer_keys/classify.py. ollama/clef-flash answered the edges of jn1-p038, jn1-p046, jn1-p047, jn1-p021-halfling, jn1-p021-cave as a third reading; hosted Clef's earlier answers on jn1-p047, jn1-p021-halfling, jn1-p021-cave are kept as a record beside the key's.
  Each disagreement was settled in a fresh Sonnet request at high effort that carried a zoomed crop, a
  wider crop, and the readings that disagreed. The resolution layer
  comes from tools/answer_keys/resolve.py by docs/tracing-conventions.md.
verified: >-
  An adversarial pass of fresh Sonnet requests at high effort rechecked every settled call and the
  agreed edges in caves, at diagonals, and around keys; a challenged call was settled once more in a
  fresh request with the challenge among its readings, and that value is the key's.
  Owner sample, in the sample app (tools/answer_keys/sample_app.py): black_white.json, 85 calls, pending;
  dark_rock.json, 71 calls, pending; cave.json, 128 calls, pending. Calls on jn1-p038, jn1-p046, jn1-p047,
  jn1-p021-halfling, jn1-p021-cave were asked again after the settling, each in a fresh request with the earlier
  answer, a measure, or a note among its readings; each map's rechecked figure counts them.
spend_usd: {claude: 27.9533, clef: 0.9563}
spend_note: >-
  Claude is every batch store's answers, which match what the Claude ledger charged these maps. Clef is what the
  Clef ledger charged hosted Clef for these maps: 5815 requests, of which the 2346 answers kept beside the key
  cost $0.1707, 3469 failed and were charged at their estimates, and 8 reservations were never settled. The
  local Clef reading cost nothing.
