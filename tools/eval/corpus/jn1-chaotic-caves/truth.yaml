# Hand-checked structural ground truth for JN1 The Chaotic Caves (r28),
# authored from the printed module: the caves key (pp. 20-35), the town and
# surroundings key (pp. 13-18), the manor key (pp. 38-43), and the printed
# maps (pp. 19, 36, 44-45). Structural facts only — printed keys, creature
# names, and codes ride the CC BY-SA 4.0 attribution in tools/eval/README.md,
# which also records the authoring conventions (singular stat-block creature
# names; treasure present = stated in-area valuables, carried included;
# connections asserted only where the printed text or map pins an area's
# complete neighbor set).
dungeons:
  - name: A. Orc Lair
    levels:
      - number: 1
        areas:
          - key: "1"
            encounters:
              - name: orc
                template: orc
                count: 6
            treasure:
              present: true
          - key: "2"
            encounters: []
            treasure:
              present: false
          - key: "3"
            encounters:
              - name: orc
                template: orc
                count: 8
            treasure:
              present: true
          - key: "4"
            encounters:
              - name: wolf
                template: normal_wolf
                count: 3
            treasure:
              present: false
          - key: "5"
            encounters:
              - name: orc warden
                custom: true
                count: 1
              - name: orc
                template: orc
                count: 2
            connections: ["4", "Jail Area"]
            doors:
              # The area title's own door ("5. DOOR TO JAIL", page 21) sits at
              # the room's threshold off the wolf-pen hall, drawn as a plain
              # door on the caves map (page 36); the wolf-pen fence gates on
              # the same route are dotted fence lines, not door glyphs.
              "4":
                kind: door
                locked: false
              # "The locked door to the east opens into the jail" (page 21).
              "Jail Area":
                kind: door
                locked: true
            treasure:
              present: true
          - key: Jail Area
            encounters:
              - name: merchant
                template: merchant
                count: 1
            connections: ["5"]
            doors:
              # The jail's one way out is the locked door back into the
              # warden's room (page 21).
              "5":
                kind: door
                locked: true
            treasure:
              present: false
          - key: "6"
            encounters:
              - name: orc chief
                custom: true
                count: 1
              - name: mountain lion
                template: mountain_lion
                count: 1
              - name: wolf
                template: normal_wolf
                count: 2
              - name: orc
                template: orc
                count: 4
            treasure:
              present: true
          - key: "7"
            encounters:
