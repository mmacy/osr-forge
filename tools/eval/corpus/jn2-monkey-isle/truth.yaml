            encounters: []
            connections: ["4", "7"]
            doors: {}
            treasure:
              present: false
          - key: "7"
            encounters:
              - name: baboon
                template: rock_baboon
                count: 7
            connections: ["6", "8"]
            doors: {}
            treasure:
              present: true
          - key: "8"
            # Asserted-empty: the northeast hall is "empty" (page 27).
            encounters: []
            connections: ["7", "9"]
            doors: {}
            treasure:
              present: false
          - key: "9"
            encounters:
              - name: orangutan cleric
                custom: true
                count: 1
              - name: orangutan
                custom: true
                count: 2
              - name: gorilla
                custom: true
                count: 2
              - name: baboon
                template: rock_baboon
                count: 2
            connections: ["8"]
            doors: {}
            treasure:
              present: true
    # Single printed level: the crevice at 4 climbs 100' to the surface
